<script>
(async()=>{'use strict';
// Same authored bank and selection rules as native demo at d6c4ad0.
// Synthetic 30/5 scenario only. Never reads or stores personal cycle data.
const response=await fetch('https://raw.githubusercontent.com/Pryshvitsyn/tune-into-her/d6c4ad00b7745065b489f9077a9ff92630ffd75a/content/editorial/ru.json');
if(!response.ok)throw Error('CONTENT_LOAD_FAILED');const bank=await response.json();
for(const key of ['actions','support','context'])if(!Array.isArray(bank[key])||bank[key].length!==24)throw Error('CONTENT_INVALID');
const catalog=[],used=new Set(),groups=[['menstrual',100],['follicular',104],['mid_cycle',100],['luteal',180]];
groups.forEach(([phase,count],p)=>{for(let i=0;i<count;i++){let a=i%28,s,c,signature;const aid=a<24?'action_'+a:phase+'_action_'+(a-24);for(let k=0;k<576;k++){s=(i+p*7+Math.floor(i/28)*5+k)%24;c=(i*7+p*5+Math.floor(i/28)*11+Math.floor(k/24))%24;signature=aid+':'+s+':'+c;if(!used.has(signature))break}if(used.has(signature))throw Error('CONTENT_COLLISION');used.add(signature);catalog.push({id:phase+'_'+String(i+1).padStart(3,'0'),phase,actionId:aid,supportId:'support_'+s,contextId:'context_'+c,copy:[a<24?bank.actions[a]:bank.phaseActions[phase][a-24],bank.support[s],bank.context[c]]})}});
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const phaseFor=d=>d<=5?'menstrual':d<15?'follicular':d<=17?'mid_cycle':'luteal';
const phaseNames={menstrual:'Во время менструации',follicular:'После менструации',mid_cycle:'Середина условного цикла',luteal:'Вторая половина условного цикла'};
const titles=['СДЕЛАЙ','ПОДДЕРЖИ','УЧТИ'],labels={yes:'Подошло',no:'Не подошло',skip:'Не пробовал'};
const reminders=d=>{const n=Math.round((Date.UTC(2020,0,d)-Date.UTC(2020,0,1))/86400000),a=[{id:'listen',text:'Сначала выслушай. Предлагай совет, если она этого хочет.'},{id:'wellbeing',text:'Самочувствие важнее расчёта.'},{id:'ask',text:'Спроси, что поможет, вместо догадок.'}],t={id:'gratitude',text:n%2===0?'Заметь её заботу и поблагодари.':'Поблагодари за конкретный поступок, который ты недавно оценил.'},lines=[a[n%3],a[(n+1)%3],t];return lines.slice(n%3).concat(lines.slice(0,n%3))};
const days=[],history=[];
for(let d=1;d<=30;d++){const phase=phaseFor(d),date='2020-01-'+String(d).padStart(2,'0'),pool=catalog.filter(c=>c.phase===phase),offset=hash(date+':2020-01-01:30:5')%pool.length,rotated=pool.slice(offset).concat(pool.slice(0,offset)),fresh=rotated.filter(c=>!history.some(h=>h.id===c.id)),recent=history.slice(-7).reverse(),cost=c=>recent.reduce((n,h,i)=>n+(7-i)*((c.id===h.id?100:0)+(c.actionId===h.actionId?4:0)+(c.supportId===h.supportId?2:0)+(c.contextId===h.contextId?1:0)),0),selected=(fresh.length?fresh:rotated).reduce((best,c)=>!best||cost(c)<cost(best)?c:best,null);history.push(selected);days.push({day:d,phase,date,cueId:selected.id,copy:selected.copy,reminders:reminders(d)})}
const KEY='tih:browser-demo:20261104:v1',speeds=[10000,30000,300000];const base=()=>({v:1,theme:'light',speed:300000,units:0,anchor:null,ratings:{}});let state=base(),storageOK=true;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1){state.theme=s.theme==='dark'?'dark':'light';state.speed=speeds.includes(s.speed)?s.speed:300000;state.units=Number.isFinite(s.units)?Math.max(0,Math.min(30,s.units)):0;state.anchor=Number.isSafeInteger(s.anchor)&&s.anchor>0&&s.anchor<=Date.now()?s.anchor:null;if(s.ratings&&typeof s.ratings==='object')for(const [k,v]of Object.entries(s.ratings))if(/^(?:[1-9]|[12]\d|30):[012]$/.test(k)&&Object.hasOwn(labels,v))state.ratings[k]=v}}catch{storageOK=false}
const $=s=>document.getElementById(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='advice',viewDay=null,editing=null,lastDay=0,toastTimer=0;
function units(now=Date.now()){return Math.min(30,Math.max(0,state.units+(state.anchor===null?0:Math.max(0,now-state.anchor)/state.speed)))}
function liveDay(){return Math.min(30,Math.floor(units())+1)}function currentDay(){return viewDay===null?liveDay():viewDay}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch{storageOK=false}$('storage-warning').hidden=storageOK}
function commitTime(){state.units=units();state.anchor=state.anchor===null?null:Date.now()}
function theme(){document.documentElement.dataset.theme=state.theme;document.querySelector('meta[name="theme-color"]').content=state.theme==='dark'?'#101113':'#FFFFFF'}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function clock(){const u=units(),done=u>=30;const seconds=Math.max(0,Math.ceil((1-u%1)*state.speed/1000));$('status').textContent=done?'Проба завершена · 30 / 30':(state.anchor===null?'Пауза':'Автопроба')+' · день '+liveDay()+' / 30';$('clock').textContent=done?'Все дни доступны для просмотра':'Смена через '+Math.floor(seconds/60).toString().padStart(2,'0')+':'+(seconds%60).toString().padStart(2,'0');$('play').textContent=done?'Заново':state.anchor===null?(u===0?'Начать':'Продолжить'):'Пауза';$('progress').style.width=u/30*100+'%';$('speed').value=String(state.speed)}
function rating(day,i){const k=day+':'+i,v=state.ratings[k];if(v&&editing!==k)return '<div class="rated"><span>'+esc(labels[v])+'</span><button data-edit="'+k+'" aria-label="Изменить оценку '+titles[i].toLowerCase()+'">Изменить</button></div>';return '<div class="feedback" role="group" aria-label="Оценка '+titles[i].toLowerCase()+'">'+Object.entries(labels).map(([id,label])=>'<button data-rate="'+k+'" data-value="'+id+'" aria-pressed="'+(v===id)+'" class="'+(v===id?'selected':'')+'">'+label+'</button>').join('')+(v?'<button class="clear" data-clear="'+k+'">Убрать отметку</button>':'')+'</div>'}
function advice(){const d=currentDay(),entry=days[d-1];return '<div class="day-nav"><button class="arrow" data-go="'+(d-1)+'" '+(d===1?'disabled':'')+' aria-label="Предыдущий день">‹</button><div class="day-heading"><h1>День '+d+'</h1><p class="phase">Демо · '+phaseNames[entry.phase]+'</p></div><button class="arrow" data-go="'+(d+1)+'" '+(d===30?'disabled':'')+' aria-label="Следующий день">›</button></div>'+(viewDay!==null?'<div class="archive">Выбран день '+d+' <button class="link-button" id="back-live">В текущий демодень '+liveDay()+'</button></div>':'<p class="archive">'+(d>1?'<button class="link-button" data-go="'+(d-1)+'">Посмотреть предыдущий день</button>':'Условный цикл, не личные данные')+'</p>')+entry.copy.map((text,i)=>'<article class="advice" data-card="'+i+'"><h2>'+titles[i]+'</h2><p class="copy">'+esc(text)+'</p><p class="reminder '+(entry.reminders[i].id==='gratitude'?'gratitude':'')+'">'+esc(entry.reminders[i].text)+'</p>'+rating(d,i)+'</article>').join('')+'<p class="note">Оценка не закрывает карточку.<br>Её можно изменить в любой момент.</p>'}
function daysPage(){return '<h1 class="section-title">30 дней пробы</h1><p class="section-subtitle">Открой любой день. Тексты остаются теми же, отметки сохраняются. Это демонстрация, а не прогноз личного цикла.</p><div class="days-grid">'+days.map(d=>{const n=[0,1,2].filter(i=>state.ratings[d.day+':'+i]).length;return '<button class="day-cell '+(d.day===liveDay()?'current':'')+'" data-go="'+d.day+'" aria-label="День '+d.day+(n?', отмечено '+n+' из трёх':'')+'">'+d.day+'<small>'+(n?n+' / 3':d.day===liveDay()?'текущий':'·')+'</small></button>'}).join('')+'</div><button class="pill wide" id="back-live">Вернуться в текущий демодень</button><p class="note">Тестовый сценарий: 30 дней, из них первые 5 — условная менструация. Данные партнёрши не используются.</p>'}
function stats(){let yes=0,no=0,skip=0;Object.values(state.ratings).forEach(v=>{if(v==='yes')yes++;else if(v==='no')no++;else skip++});return {yes,no,skip,total:yes+no+skip,tried:yes+no,rate:yes+no?Math.round(yes/(yes+no)*100):null}}
function statsPage(){const s=stats();return '<h1 class="section-title">Твои отметки</h1><p class="section-subtitle">Только ответы этой пробы. Повторное нажатие не добавляет новый ответ, изменение заменяет прежний.</p><div class="metrics"><div class="metric"><strong>'+s.total+' <small style="font-size:15px;color:var(--muted)">/ 90</small></strong><span>карточек оценено<br>за 30 демодней</span></div><div class="metric"><strong>'+(s.rate===null?'—':s.rate+'%')+'</strong><span>подошло из опробованных<br>'+s.yes+' из '+s.tried+'</span></div></div><div class="section-box"><h2>Доля всех ответов</h2>'+[['yes','Подошло'],['no','Не подошло'],['skip','Не пробовал']].map(([k,l])=>{const p=s.total?Math.round(s[k]/s.total*100):0;return '<div class="stat-row"><div class="caption"><span>'+l+'</span><span>'+s[k]+' · '+(s.total?p+'%':'—')+'</span></div><div class="bar"><span style="width:'+p+'%"></span></div></div>'}).join('')+'<p class="help">«Не пробовал» не означает «Не подошло». Карточки без отметки в проценты не входят. Проценты округлены.</p></div><p class="note">Это твоя оценка полезности совета,<br>не оценка партнёрши.</p><button class="pill wide" data-tab="settings">Назад к настройкам</button>'}
function settings(){return '<h1 class="section-title">Настройки</h1><p class="section-subtitle">Тексты и основные цвета — из проекта Tune Into Her. История и оценки добавлены в эту браузерную пробу.</p><section class="section-box"><h2>Оформление</h2><div class="setting-row"><label for="theme">Тема</label><select id="theme" class="compact"><option value="light" '+(state.theme==='light'?'selected':'')+'>Светлая</option><option value="dark" '+(state.theme==='dark'?'selected':'')+'>Тёмная</option></select></div><p class="help">Один вертикальный экран, обычная прокрутка. Размер телефона не искажается.</p></section><section class="section-box"><h2>Обратная связь</h2><button class="pill wide" data-tab="stats">Мини-аналитика · '+stats().total+' отметок</button><p class="help">Все оценки можно исправлять. Они хранятся в этом браузере; автоматической персонализации пока нет.</p></section><section class="section-box"><h2>Ускоренная проба</h2><p class="help">5 минут на день — весь сценарий за 2 часа 30 минут. Для быстрой проверки выбери 10 секунд. Стрелки и сетка дней работают и без запуска таймера.</p><button class="pill wide" id="restart">Вернуться к дню 1</button><button class="pill wide danger" id="reset">Удалить отметки пробы</button></section><section class="section-box"><h2>Что проверяем здесь</h2><p class="help">Смену 30 дней, тексты, светлую и тёмную темы, историю, оценки и проценты. Пока страница закрыта, уведомления на телефон не приходят. Отсчёт при запущенной пробе продолжает идти по времени.</p><p class="help">Это рабочая веб-проба, не установленная iOS-сборка. Она не меняет реальный цикл и расписания ChatGPT. Не вводи сюда личные сведения.</p><p class="help">Публичный просмотр через HTML Preview. Тестовые отметки остаются в хранилище браузера этого сайта. Не используй его для личных или медицинских данных.</p></section><p class="note">Tune Into Her · THEA<br>Браузерная проба 1.0 · русский язык</p>'}
function render(){theme();$('page').innerHTML=tab==='advice'?advice():tab==='days'?daysPage():tab==='stats'?statsPage():settings();document.querySelectorAll('.bottom-nav button').forEach(b=>{const active=b.dataset.tab===(tab==='stats'?'settings':tab);b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});clock();$('storage-warning').hidden=storageOK;lastDay=liveDay()}
function navigate(t){tab=t;editing=null;render();window.scrollTo({top:0,behavior:'instant'})}
function go(d){if(!Number.isInteger(d)||d<1||d>30)return;viewDay=d===liveDay()?null:d;tab='advice';editing=null;render();window.scrollTo({top:0,behavior:'instant'})}
function confirmAction(title,text,fn){$('dialog-title').textContent=title;$('dialog-text').textContent=text;$('dialog-actions').innerHTML='<button class="pill" id="cancel-dialog">Отмена</button><button class="pill primary" id="confirm-dialog">Подтвердить</button>';$('cancel-dialog').onclick=()=>$('dialog').close();$('confirm-dialog').onclick=()=>{$('dialog').close();fn()};$('dialog').showModal()}
function restart(){state.units=0;state.anchor=null;viewDay=null;editing=null;save();navigate('advice');toast('День 1. Твои оценки сохранены')}
$('play').disabled=false;$('play').onclick=()=>{if(units()>=30){restart();return}if(state.anchor===null){state.anchor=Date.now();viewDay=null;toast('Автопроба запущена')}else{state.units=units();state.anchor=null;toast('Пауза')}save();render()};
$('speed').onchange=e=>{commitTime();state.speed=Number(e.target.value);save();clock();toast('Скорость изменена. Текущий день сохранён')};
$('about').onclick=()=>{$('dialog-title').textContent='THEA';$('dialog-text').textContent='Семейная группа, создающая продукты для развития личности, образования и повседневной жизни. Tune Into Her — практические подсказки для внимательной поддержки партнёрши.';$('dialog-actions').innerHTML='<button class="pill primary" id="close-dialog">Закрыть</button>';$('close-dialog').onclick=()=>$('dialog').close();$('dialog').showModal()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab){navigate(b.dataset.tab);return}if(b.dataset.go){go(Number(b.dataset.go));return}if(b.id==='back-live'){viewDay=null;navigate('advice');return}if(b.dataset.rate){state.ratings[b.dataset.rate]=b.dataset.value;editing=null;save();render();toast('Отметка сохранена');return}if(b.dataset.edit){editing=b.dataset.edit;render();return}if(b.dataset.clear){delete state.ratings[b.dataset.clear];editing=null;save();render();toast('Отметка убрана');return}if(b.id==='restart'){confirmAction('Начать с первого дня?','Таймер остановится. Все оценки сохранятся.',restart);return}if(b.id==='reset'){confirmAction('Удалить оценки пробы?','Будут удалены только ответы в этой веб-пробе. Реальные данные приложения не затрагиваются.',()=>{state.ratings={};save();render();toast('Оценки удалены')})}});
document.addEventListener('change',e=>{if(e.target.id==='theme'){state.theme=e.target.value==='dark'?'dark':'light';save();render()}});
function tick(){const d=liveDay();if(units()>=30&&state.anchor!==null){state.units=30;state.anchor=null;save();toast('Проба завершена. Все 30 дней сохранены');render()}else if(d!==lastDay){lastDay=d;editing=null;render();if(tab==='advice'&&viewDay===null){window.scrollTo({top:0,behavior:'instant'});toast('Демодень '+d)}}else clock()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});window.addEventListener('pageshow',tick);
window.TIH_DEMO={get days(){return JSON.parse(JSON.stringify(days))},get catalogSize(){return catalog.length},get state(){return JSON.parse(JSON.stringify(state))},get stats(){return stats()},get liveDay(){return liveDay()}};
render();setInterval(tick,250);
})().catch(error=>{const p=document.getElementById('page');p.innerHTML='<h1 class="section-title">Не удалось загрузить пробу</h1><p class="section-subtitle">Проверь соединение с интернетом и обнови страницу.</p><button class="pill" id="reload-preview">Повторить</button>';document.getElementById('reload-preview').onclick=()=>location.reload();console.error(error)});
</script></body></html>
