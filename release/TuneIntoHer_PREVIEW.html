function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function button(s){return '<button class="primary" data-demo>'+e(s)+'</button>'}
function shell(label,html){return '<section><div class="label">'+label+'</div><div class="phone"><div class="status"><span>9:41</span><span class="island"></span><span>▰</span></div><div class="screen">'+html+'</div></div></section>'}
function render(){let code=language.value;document.documentElement.lang=code;const t=all[code],cue=sample[code];const sphere='<img class="orb" alt="" src="'+orb+'">';const word='<div class="wordmark">Tune Into Her <span>•••</span></div>';const chips=Object.entries(labels).map(([c,l])=>'<button class="chip '+(c===code?'selected':'')+'" data-code="'+c+'">'+e(l)+'</button>').join('');

const consent='<div class="progress"></div><p class="eyebrow" style="margin-top:40px">02 / 07</p><h2>'+e(t.onboarding.contextTitle)+'</h2><p class="body">'+e(t.onboarding.contextBody)+'</p><div class="badge">'+e(t.onboarding.privacy)+'</div><label class="consent"><input type="checkbox" class="check">'+e(t.onboarding.acknowledge)+'</label>'+button(t.common.continue);
const today=word+sphere+'<div class="center"><div class="day">'+e(t.today.day.replace('{{day}}','22'))+'</div><div class="phase">'+e(t.today.approxPhase.replace('{{phase}}',t.phase.luteal))+'</div></div><div class="card"><div class="eyebrow">'+e(t.today.today)+'</div><p class="context">'+e(cue.context)+'</p><div class="divider"></div><div class="eyebrow">'+e(t.today.goodMove)+'</div><p class="cue">'+e(cue.cue)+'</p><button class="link" data-demo>'+e(t.today.learnMore)+' →</button></div><p class="small center">'+e(t.today.estimated)+'</p><div class="center"><button class="link" data-demo>'+e(t.today.update)+'</button></div>';
