<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350"><rect width="1080" height="1350" fill="#E8E8F0"/><circle cx="1000" cy="100" r="330" fill="none" stroke="#51486B" stroke-width="2" opacity=".3"/><circle cx="1000" cy="100" r="260" fill="none" stroke="#51486B" stroke-width="2" opacity=".3"/><text x="86" y="112" fill="#51486B" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700"><tspan x="86" dy="0">TUNE INTO HER</tspan></text><text x="86" y="277" fill="#51486B" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400"><tspan x="86" dy="0">01 / 05</tspan></text><text x="80" y="430" fill="#253B32" font-family="DejaVu Sans, sans-serif" font-size="72" font-weight="600"><tspan x="80" dy="0">A cycle is</tspan><tspan x="80" dy="90">not a personality.</tspan></text><rect x="86" y="735" width="70" height="5" rx="2" fill="#51486B"/><text x="86" y="820" fill="#253B32" font-family="DejaVu Sans, sans-serif" font-size="33" font-weight="400"><tspan x="86" dy="0">People deserve more than a label.</tspan></text><line x1="86" y1="1190" x2="994" y2="1190" stroke="#51486B" opacity=".3"/><text x="86" y="1250" fill="#51486B" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600"><tspan x="86" dy="0">DON’T GUESS. TUNE IN.</tspan></text><text x="946" y="1250" fill="#51486B" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="400"><tspan x="946" dy="0">→</tspan></text></svg>